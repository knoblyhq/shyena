[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shyena"
version = "0.0.1"
description = "Shyena — code profiler for vulnerabilities, licences, compatibility and code smell (Knobly GRC code module)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Knobly" }]
keywords = ["sast", "sca", "sbom", "licence", "code-quality", "sarif"]

# `vapt` is the Knobly GRC core (probe contract, Finding model, run store, reports,
# dashboard). It is not on PyPI: install it first with `pip install -e D:\vapt`.
dependencies = [
    "vapt>=0.1.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
shyena = "shyena.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["shyena*"]

[tool.setuptools.package-data]
"shyena.rules" = ["semgrep/**/*.yml", "semgrep/**/*.yaml", "**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
