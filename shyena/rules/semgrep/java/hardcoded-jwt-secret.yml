rules:
  - id: shyena.java.hardcoded-jwt-secret
    message: >-
      A JWT signing key is a string literal in the code (or the default of a @Value
      placeholder). Anyone with the source, a jar or a decompiler can mint valid tokens
      for any user. Read the key from the environment or a secret store, with no
      default, and rotate the one that was committed.
    languages: [java]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      confidence: HIGH
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/JSON_Web_Token_for_Java_Cheat_Sheet.html
    pattern-either:
      # jjwt
      - pattern: Keys.hmacShaKeyFor("$KEY".getBytes(...))
      - pattern: Keys.hmacShaKeyFor(Decoders.BASE64.decode("$KEY"))
      - pattern: $B.signWith($ALG, "$KEY")
      - pattern: $B.signWith("$KEY".getBytes(...), ...)
      - pattern: $P.setSigningKey("$KEY")
      - pattern: $P.setSigningKey("$KEY".getBytes(...))
      # auth0 java-jwt
      - pattern: Algorithm.HMAC256("$KEY")
      - pattern: Algorithm.HMAC384("$KEY")
      - pattern: Algorithm.HMAC512("$KEY")
      # Nimbus / Spring Security
      - pattern: new MACSigner("$KEY")
      - pattern: new MACVerifier("$KEY")
      - pattern: new SecretKeySpec("$KEY".getBytes(...), ...)
      # @Value("${jwt.secret:some-default}") ships the default when the property is unset.
      - patterns:
          - pattern: '@Value("$EXPR")'
          - metavariable-regex:
              metavariable: $EXPR
              regex: (?i)^\$\{[^:}]*(jwt|token|signing|hmac)[^:}]*(secret|key)[^:}]*:[^}]+\}$
