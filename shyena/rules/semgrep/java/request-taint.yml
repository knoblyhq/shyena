# Spring MVC / Spring Boot: request data reaching a dangerous sink (intra-file taint).
#
# Every rule in this file shares one definition of "request data" (the &request anchor):
#   - any parameter of a handler method (@GetMapping, @PostMapping, @RequestMapping, ...),
#     annotated or not, except numeric, boolean, UUID and date types, which cannot
#     carry an injection payload once Spring has converted them;
#   - values read from HttpServletRequest (getParameter, getHeader, getCookies, ...).
# Taint follows assignments, string concatenation, String.format, StringBuilder and
# method calls on a tainted object (so multipartFile.getOriginalFilename() is tainted).
# It does not cross files: a value handed to a service class and used there is missed.
rules:
  - id: shyena.java.sqli-taint
    mode: taint
    message: >-
      Request data reaches a SQL or JPQL query string. Pass it as a bound parameter
      (`?` or `:name` with JdbcTemplate, `setParameter` with JPA, a derived or @Query
      repository method) instead of concatenating or formatting it into the query.
    languages: [java]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      confidence: HIGH
      references:
        - https://docs.spring.io/spring-framework/reference/data-access/jdbc/core.html
        - https://cheatsheetseries.owasp.org/cheatsheets/Query_Parameterization_Cheat_Sheet.html
    pattern-sources: &request
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$MAPPING(...)
                  $RET $METHOD(..., $TYPE $PARAM, ...) { ... }
              - pattern-inside: |
                  @$MAPPING
                  $RET $METHOD(..., $TYPE $PARAM, ...) { ... }
          - metavariable-regex:
              metavariable: $MAPPING
              regex: ^(RequestMapping|GetMapping|PostMapping|PutMapping|PatchMapping|DeleteMapping)$
          - metavariable-regex:
              metavariable: $TYPE
              regex: ^(?!(int|long|short|byte|double|float|boolean|Integer|Long|Short|Byte|Double|Float|Boolean|UUID|BigDecimal|BigInteger|LocalDate|LocalDateTime|LocalTime|OffsetDateTime|ZonedDateTime|Instant|Pageable|Sort|Locale|HttpServletResponse|Model|ModelMap|BindingResult|RedirectAttributes)$)
          - pattern: $PARAM
      - patterns:
          - pattern: (HttpServletRequest $REQ).$GETTER(...)
          - metavariable-regex:
              metavariable: $GETTER
              regex: ^(getParameter|getParameterValues|getParameterMap|getParameterNames|getHeader|getHeaders|getQueryString|getRequestURI|getRequestURL|getPathInfo|getCookies|getInputStream|getReader|getPart|getParts)$
    pattern-sanitizers: &numeric
      - pattern-either:
          - pattern: Integer.parseInt(...)
          - pattern: Integer.valueOf(...)
          - pattern: Long.parseLong(...)
          - pattern: Long.valueOf(...)
          - pattern: Double.parseDouble(...)
          - pattern: UUID.fromString(...)
    pattern-sinks:
      - patterns:
          # &sql_calls is reused by shyena.java.sql-non-constant below.
          - pattern-either: &sql_calls
              - patterns:
                  - pattern-either:
                      - pattern: (JdbcTemplate $DB).$CALL($Q, ...)
                      - pattern: (JdbcOperations $DB).$CALL($Q, ...)
                      - pattern: (NamedParameterJdbcTemplate $DB).$CALL($Q, ...)
                      - pattern: (NamedParameterJdbcOperations $DB).$CALL($Q, ...)
                      - patterns:
                          - pattern: $DB.$CALL($Q, ...)
                          - metavariable-regex:
                              metavariable: $DB
                              regex: (?i)jdbc
                  - metavariable-regex:
                      metavariable: $CALL
                      regex: ^(query|queryForObject|queryForList|queryForMap|queryForRowSet|queryForStream|update|batchUpdate|execute)$
              - pattern: (JdbcClient $DB).sql($Q)
              - pattern: (EntityManager $EM).createQuery($Q, ...)
              - pattern: (EntityManager $EM).createNativeQuery($Q, ...)
              - pattern: (Session $S).createQuery($Q, ...)
              - pattern: (Session $S).createNativeQuery($Q, ...)
              - pattern: (Session $S).createSQLQuery($Q)
              - pattern: (Statement $ST).executeQuery($Q)
              - pattern: (Statement $ST).execute($Q, ...)
              - pattern: (Statement $ST).executeUpdate($Q, ...)
              - pattern: (Statement $ST).executeLargeUpdate($Q, ...)
              - pattern: (Statement $ST).addBatch($Q)
              - pattern: (Connection $C).prepareStatement($Q, ...)
              - pattern: (Connection $C).prepareCall($Q, ...)
              - pattern: (Connection $C).createStatement().$EXEC($Q, ...)
              # R2DBC (reactive Postgres)
              - pattern: (DatabaseClient $DB).sql($Q)
              - pattern: (R2dbcEntityTemplate $DB).getDatabaseClient().sql($Q)
              # jOOQ plain-SQL API
              - patterns:
                  - pattern-either:
                      - pattern: (DSLContext $DB).$CALL($Q, ...)
                      - patterns:
                          - pattern: $DB.$CALL($Q, ...)
                          - metavariable-regex:
                              metavariable: $DB
                              regex: ^(dsl|ctx|create|jooq|dslContext)$
                  - metavariable-regex:
                      metavariable: $CALL
                      regex: ^(fetch|fetchOne|fetchSingle|fetchOptional|fetchAny|fetchLazy|fetchStream|fetchValue|fetchMany|execute|query|resultQuery)$
              - pattern: DSL.condition($Q, ...)
              - pattern: DSL.field($Q, ...)
              - pattern: DSL.table($Q, ...)
              - pattern: DSL.sql($Q, ...)
          - focus-metavariable: $Q

  # Taint stops at a file boundary, and in a layered Spring app the SQL is usually
  # built in a repository or DAO class that never sees a @RequestParam. This rule needs
  # no taint: it reports any SQL/JPQL string that is not a compile-time constant,
  # wherever it is built. Expect some noise (an IN (?, ?, ?) list built in a loop, a
  # table name from config); it is a WARNING so it informs without failing the gate.
  - id: shyena.java.sql-non-constant
    message: >-
      A SQL or JPQL query is built at run time (concatenation, String.format,
      StringBuilder or a variable) rather than being a constant. If any part can come
      from a caller, this is SQL injection. Keep the query text constant and pass values
      as bound parameters; for dynamic ORDER BY or column names, map the input to an
      allow-listed constant.
    languages: [java]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      confidence: LOW
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Query_Parameterization_Cheat_Sheet.html
    patterns:
      - pattern-either: *sql_calls
      # Handler methods are covered, with more precision, by shyena.java.sqli-taint.
      - pattern-not-inside: |
          @$MAPPING(...)
          $RET $METHOD(...) { ... }
      - pattern-not-inside: |
          @$MAPPING
          $RET $METHOD(...) { ... }
      - focus-metavariable: $Q
      # Constants: literals, text blocks, local variables holding one (Semgrep's constant
      # propagation), and UPPER_CASE static constants, also from another class.
      # These pattern-nots match the whole call: negatives are applied before the focus.
      - pattern-not: $DB.$CALL("...", ...)
      - pattern-not: $DB.$GET().$CALL("...", ...)
      - metavariable-regex:
          metavariable: $Q
          regex: ^(?!([A-Z][A-Za-z0-9_]*\.)?[A-Z][A-Z0-9_]*$)

  - id: shyena.java.redis-lua-injection
    mode: taint
    message: >-
      Request data becomes part of a Redis Lua script. The script runs inside Redis with
      access to every key, so a caller can read, change or delete any data in that
      Redis. Keep the script constant and pass input through KEYS and ARGV.
    languages: [java]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-94: Improper Control of Generation of Code ('Code Injection')"
      confidence: HIGH
      references:
        - https://redis.io/docs/latest/develop/interact/programmability/eval-intro/
    pattern-sources: *request
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: new DefaultRedisScript<$T>($SCRIPT, ...)
              - pattern: new DefaultRedisScript<>($SCRIPT, ...)
              - pattern: new DefaultRedisScript($SCRIPT, ...)
              - pattern: RedisScript.of($SCRIPT, ...)
              - pattern: (Jedis $R).eval($SCRIPT, ...)
              - pattern: (JedisPooled $R).eval($SCRIPT, ...)
              - pattern: (UnifiedJedis $R).eval($SCRIPT, ...)
              - pattern: (RedisCommands $R).eval($SCRIPT, ...)
              - pattern: (RedisAsyncCommands $R).eval($SCRIPT, ...)
              - pattern: (RedisReactiveCommands $R).eval($SCRIPT, ...)
              - pattern: (RedisScriptingCommands $R).eval($SCRIPT, ...)
              - patterns:
                  - pattern: $R.eval($SCRIPT, ...)
                  - metavariable-regex:
                      metavariable: $R
                      regex: (?i)(redis|jedis|lettuce|commands)
          - focus-metavariable: $SCRIPT

  - id: shyena.java.spel-injection
    mode: taint
    message: >-
      Request data is parsed as a Spring Expression Language (SpEL) expression. SpEL can
      call any method on the classpath, so this is remote code execution. Never parse
      input as an expression; if you must evaluate one, use SimpleEvaluationContext.
    languages: [java]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-917: Improper Neutralization of Special Elements used in an Expression Language Statement"
      confidence: HIGH
      references:
        - https://docs.spring.io/spring-framework/reference/core/expressions/evaluation.html
    pattern-sources: *request
    pattern-sinks:
      - patterns:
          - pattern: $PARSER.parseExpression($EXPR, ...)
          - focus-metavariable: $EXPR

  - id: shyena.java.command-injection
    mode: taint
    message: >-
      Request data reaches an operating-system command. Do not build commands from input:
      call a library instead, or pass fixed program names to ProcessBuilder with the input
      as a separate, allow-listed argument (never through `sh -c` or `cmd /c`).
    languages: [java]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
      confidence: HIGH
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/OS_Command_Injection_Defense_Cheat_Sheet.html
    pattern-sources: *request
    pattern-sanitizers: *numeric
    pattern-sinks:
      - pattern-either:
          - pattern: Runtime.getRuntime().exec(...)
          - pattern: (Runtime $RT).exec(...)
          - pattern: new ProcessBuilder(...)
          - pattern: (ProcessBuilder $PB).command(...)

  - id: shyena.java.ssrf
    mode: taint
    message: >-
      Request data chooses the URL of an outbound HTTP call, so a caller can make the
      server fetch internal addresses (cloud metadata, admin ports, other services).
      Build the URL from a fixed base and pass input only as path or query variables,
      or check the host against an allow-list first.
    languages: [java]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-918: Server-Side Request Forgery (SSRF)"
      confidence: MEDIUM
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html
    pattern-sources: *request
    pattern-sanitizers:
      # "https://fixed-host/path/" + input: the host is ours, only the path varies.
      - patterns:
          - pattern: '"$BASE" + $X'
          - metavariable-regex:
              metavariable: $BASE
              regex: ^https?://[^/]+/
    pattern-sinks:
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern: (RestTemplate $HTTP).$CALL($URL, ...)
                      - pattern: (RestOperations $HTTP).$CALL($URL, ...)
                      - patterns:
                          - pattern: $HTTP.$CALL($URL, ...)
                          - metavariable-regex:
                              metavariable: $HTTP
                              regex: (?i)resttemplate
                  - metavariable-regex:
                      metavariable: $CALL
                      regex: ^(getForObject|getForEntity|postForObject|postForEntity|postForLocation|exchange|execute|put|patchForObject|delete|headForHeaders|optionsForAllow)$
              - pattern: $SPEC.uri($URL, ...)
              - pattern: new URL($URL)
              - pattern: HttpRequest.newBuilder($URL)
              - pattern: (WebClient.Builder $B).baseUrl($URL)
              - pattern: WebClient.create($URL)
              - pattern: RestClient.create($URL)
          - focus-metavariable: $URL

  - id: shyena.java.path-traversal
    mode: taint
    message: >-
      Request data (a parameter, or an uploaded file's original name) becomes part of a
      filesystem path, so `../` can read or overwrite files outside the intended folder.
      Keep only the file name (FilenameUtils.getName or Path.getFileName), or resolve
      against the base directory, normalize, and reject anything outside it.
    languages: [java]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory"
      confidence: MEDIUM
      references:
        - https://owasp.org/www-community/attacks/Path_Traversal
    pattern-sources: *request
    pattern-sanitizers:
      - pattern-either:
          - pattern: FilenameUtils.getName(...)
          - pattern: $P.getFileName()
          - pattern: Integer.parseInt(...)
          - pattern: Long.parseLong(...)
          - pattern: UUID.fromString(...)
    pattern-sinks:
      - patterns:
          - pattern-not-inside: |
              if (<... $X.startsWith(...) ...>) { ... }
          - pattern-either:
              - pattern: new File(...)
              - pattern: Paths.get(...)
              - pattern: Path.of(...)
              - pattern: (Path $BASE).resolve(...)
              - pattern: new FileInputStream(...)
              - pattern: new FileOutputStream(...)
              - pattern: new FileReader(...)
              - pattern: new FileWriter(...)
              - pattern: new RandomAccessFile(...)
              - pattern: new FileSystemResource(...)

  - id: shyena.java.open-redirect
    mode: taint
    message: >-
      Request data decides where the browser is redirected, so a link to your site can
      send users to a phishing page. Redirect only to relative paths you build, or check
      the target against an allow-list of hosts.
    languages: [java]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-601: URL Redirection to Untrusted Site ('Open Redirect')"
      confidence: MEDIUM
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Unvalidated_Redirects_and_Forwards_Cheat_Sheet.html
    pattern-sources: *request
    pattern-sanitizers:
      # "/fixed/path/" + input stays on this site (but "//host" would not).
      - patterns:
          - pattern: '"$BASE" + $X'
          - metavariable-regex:
              metavariable: $BASE
              regex: ^/[^/\\]
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: '"redirect:" + $TARGET'
              - pattern: (HttpServletResponse $RESP).sendRedirect($TARGET)
              - pattern: new RedirectView($TARGET, ...)
              - pattern: new ModelAndView("redirect:" + $TARGET, ...)
              - pattern: $RESPONSE.location(URI.create($TARGET))
              - pattern: $RESPONSE.header("Location", $TARGET)
          - focus-metavariable: $TARGET
