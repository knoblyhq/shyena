# PostgreSQL as used from a Spring Boot service.
rules:
  - id: shyena.java.postgres-weak-sslmode
    message: >-
      The PostgreSQL JDBC URL sets sslmode to disable, allow or prefer. With these, the
      connection is unencrypted, or encrypted without checking the server's certificate,
      so anyone on the network path can read or impersonate the database (credentials
      included). Use sslmode=verify-full (or require plus a pinned sslrootcert) for any
      database that is not on localhost.
    languages: [generic]
    severity: WARNING
    paths:
      include: ["**/application*.properties", "**/application*.yml", "**/application*.yaml", "**/bootstrap*.properties", "**/bootstrap*.yml", "**/bootstrap*.yaml", "*.java"]
    metadata:
      category: security
      cwe: "CWE-319: Cleartext Transmission of Sensitive Information"
      confidence: HIGH
      references:
        - https://jdbc.postgresql.org/documentation/ssl/
    pattern-regex: jdbc:postgresql://(?!(localhost|127\.0\.0\.1|\[::1\])[:/])[^\s"'?]+\?[^\s"']*\bsslmode=(disable|allow|prefer)\b

  - id: shyena.java.postgres-superuser-login
    message: >-
      The application logs in to PostgreSQL as the "postgres" superuser. Any SQL
      injection then becomes full control of the database server (COPY ... PROGRAM runs
      shell commands as the postgres OS user). Create an application role that owns only
      its schema, and run migrations with a separate role.
    languages: [generic]
    severity: WARNING
    paths:
      include: ["**/application*.properties", "**/application*.yml", "**/application*.yaml", "**/bootstrap*.properties", "**/bootstrap*.yml", "**/bootstrap*.yaml"]
      exclude: ["**/application-dev*", "**/application-local*", "**/application-test*"]
    metadata:
      category: security
      cwe: "CWE-250: Execution with Unnecessary Privileges"
      confidence: MEDIUM
      references:
        - https://www.postgresql.org/docs/current/predefined-roles.html
    pattern-either:
      - pattern-regex: (?m)^[ \t]*spring\.(datasource|r2dbc|flyway|liquibase)\.(username|user)[ \t]*[=:][ \t]*["']?postgres["']?[ \t]*$
      - pattern-regex: (?m)^[ \t]*(username|user):[ \t]*["']?postgres["']?[ \t]*$

  - id: shyena.java.postgres-dangerous-function
    message: >-
      SQL uses a PostgreSQL feature that reaches outside the database: COPY ... PROGRAM
      (runs a shell command), COPY to or from a server file, lo_import / lo_export,
      pg_read_file / pg_read_binary_file / pg_ls_dir, or dblink. These need superuser or
      pg_*_server_files roles; an application role should not have them. Move the job
      out of the app, or confirm the role and inputs are fixed.
    languages: [java]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-250: Execution with Unnecessary Privileges"
      confidence: MEDIUM
      references:
        - https://www.postgresql.org/docs/current/sql-copy.html
    # A regex over one Java string literal; Semgrep's "$X" string binding proved
    # unreliable for this.
    pattern-regex: (?i)"[^"\n]*(\bCOPY\b[^"\n]*\b(FROM|TO)\s+PROGRAM\b|\bCOPY\b[^"\n]*\b(FROM|TO)\s+'/|\blo_(import|export)\s*\(|\bpg_read_(binary_)?file\s*\(|\bpg_ls_dir\s*\(|\bdblink(_exec|_connect)?\s*\()[^"\n]*"

  - id: shyena.java.postgres-dangerous-function-migration
    message: >-
      A migration uses a PostgreSQL feature that reaches outside the database (COPY ...
      PROGRAM, COPY to or from a server file, lo_import / lo_export, pg_read_file,
      pg_ls_dir). The role running migrations then needs superuser-level rights. Confirm
      this is intended and that the app itself does not run with that role.
    languages: [generic]
    severity: WARNING
    paths:
      include: ["**/db/migration/**/*.sql", "**/db/changelog/**/*.sql", "**/resources/**/*.sql"]
    metadata:
      category: security
      cwe: "CWE-250: Execution with Unnecessary Privileges"
      confidence: MEDIUM
      references:
        - https://www.postgresql.org/docs/current/sql-copy.html
    pattern-regex: (?i)(\bCOPY\b[^;]*\b(FROM|TO)\s+PROGRAM\b|\bCOPY\b[^;]*\b(FROM|TO)\s+'/|\blo_(import|export)\s*\(|\bpg_read_(binary_)?file\s*\(|\bpg_ls_dir\s*\()
