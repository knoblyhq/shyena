rules:
  - id: shyena.php.xss-echo-request
    mode: taint
    message: >-
      Request data is written into the page without escaping. Wrap it in
      htmlspecialchars($value, ENT_QUOTES, 'UTF-8') (or your template engine's escape)
      before echoing.
    languages: [php]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation"
      confidence: MEDIUM
      references:
        - https://owasp.org/www-community/attacks/xss/
    pattern-sources:
      - pattern-either:
          - pattern: $_GET
          - pattern: $_POST
          - pattern: $_REQUEST
          - pattern: $_COOKIE
          - pattern: $_SERVER['QUERY_STRING']
          - pattern: $_SERVER['REQUEST_URI']
          - pattern: $_SERVER['HTTP_REFERER']
    pattern-sanitizers:
      - pattern-either:
          - pattern: htmlspecialchars(...)
          - pattern: htmlentities(...)
          - pattern: intval(...)
          - pattern: (int) $X
          - pattern: json_encode(...)
          - pattern: urlencode(...)
          - pattern: rawurlencode(...)
          - pattern: filter_var($X, FILTER_VALIDATE_INT, ...)
          - pattern: filter_var($X, FILTER_VALIDATE_EMAIL, ...)
          - pattern: e(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: echo $X;
              - pattern: echo $X, ...;
              - pattern: print $X;
              - pattern: printf($X, ...);
              - pattern: print_r($X);
          - focus-metavariable: $X
