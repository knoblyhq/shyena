# ruleid: shyena.java.postgres-weak-sslmode
spring.datasource.url=jdbc:postgresql://orders-db.internal:5432/orders?sslmode=disable
# ruleid: shyena.java.postgres-superuser-login
spring.datasource.username=postgres
# ok: shyena.java.spring-secret-in-config
spring.datasource.password=${DB_PASSWORD}
# ruleid: shyena.java.redis-no-tls
spring.data.redis.url=redis://:${REDIS_PASSWORD}@cache.internal:6379
# ruleid: shyena.java.redis-no-tls
spring.data.redis.ssl.enabled=false
